services:
  mongodb:
    image: mongo:7.0
    container_name: rmap-mongodb
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - rmap_mongo_data:/data/db
    healthcheck:
      test: >
        mongosh --quiet --eval "
          try {
            const st = rs.status();
            if (st.ok === 1) quit(0);
          } catch (e) {}
          rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] });
          quit(0);
        "
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    container_name: rmap-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - rmap_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.22
    container_name: rmap-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"

volumes:
  rmap_mongo_data:
  rmap_redis_data:
